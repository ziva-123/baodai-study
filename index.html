<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保代学习 · 个人题库</title>
  <meta name="description" content="财务与法规分库练习，记录错题、收藏与学习进度。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="./"><b>保</b><span>保代学习<small>个人练习空间</small></span></a>
    <span class="local">记录保存在此浏览器</span>
  </header>
  <main>
    <section class="intro">
      <div><p class="eyebrow">QUESTION BANK / 2026</p><h1>今天，从一道题开始。</h1></div>
      <div class="banks" aria-label="选择题库">
        <button data-bank="财务" class="active">财务 <span>会计 · 财管 · 审计</span></button>
        <button data-bank="法规">法规 <span>保荐 · 融资 · 持续督导</span></button>
      </div>
    </section>
    <section id="stats" class="stats"></section>
    <div class="workspace">
      <aside>
        <h2>练习范围</h2>
        <nav id="views">
          <button data-view="all" class="active">全部题目</button>
          <button data-view="wrong">错题本</button>
          <button data-view="star">我的收藏</button>
          <button data-view="unseen">未做题目</button>
        </nav>
        <label>搜索题目<input id="search" type="search" placeholder="关键词 / 题目 ID"></label>
        <label>章节<select id="chapter"><option value="">全部章节</option></select></label>
        <label>题目类型<select id="type"><option value="">全部题型</option><option>单选题</option><option>多选题</option><option>判断题</option><option>不定项选择题</option></select></label>
        <label>标签<select id="tag"><option value="">全部标签</option></select></label>
        <p class="note">题目与解析来自你提供的 PDF。原资料内容保留，不代表已按最新规则修订。</p>
      </aside>
      <section class="practice">
        <div class="toolbar"><span id="scope">正在整理题库</span><select id="mode" aria-label="练习顺序"><option value="order">顺序刷题</option><option value="random">随机刷题</option></select></div>
        <article id="question"><div class="empty"><h2>题库正在整理中</h2><p>财务与法规将分别记录你的学习进度。</p></div></article>
        <div id="pager" class="pager"></div>
        <details class="question-list"><summary>题目目录 · 快速跳转</summary><div id="list"></div><button id="more" hidden>显示更多</button></details>
      </section>
    </div>
    <footer>保代学习 <span>专注练习，慢慢积累。</span><span id="quality"></span></footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
